<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#7f53ac" />
      <stop offset="100%" stop-color="#ff0844" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Shield Icon Group -->
  <g transform="translate(10, 10)">
    <!-- Outer Shield Outline -->
    <path d="M 50 10 L 85 25 C 85 65 65 90 50 100 C 35 90 15 65 15 25 Z" 
          fill="rgba(18, 26, 43, 0.85)" 
          stroke="url(#shieldGrad)" 
          stroke-width="3.5" 
          filter="url(#neonGlow)" />
    
    <!-- Inner Soundwave Bars -->
    <g stroke="url(#waveGrad)" stroke-width="3" stroke-linecap="round">
      <line x1="33" y1="50" x2="33" y2="60" />
      <line x1="41" y1="42" x2="41" y2="68" />
      <line x1="50" y1="34" x2="50" y2="76" />
      <line x1="59" y1="42" x2="59" y2="68" />
      <line x1="67" y1="50" x2="67" y2="60" />
    </g>

    <!-- AI Spark Nodes -->
    <circle cx="50" cy="22" r="3" fill="#00f2fe" filter="url(#neonGlow)" />
    <circle cx="27" cy="72" r="2.5" fill="#4facfe" />
    <circle cx="73" cy="72" r="2.5" fill="#4facfe" />
  </g>

  <!-- Brand Typography -->
  <text x="110" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="38" fill="#ffffff" letter-spacing="0.5">
    Vox<tspan fill="url(#shieldGrad)">Shield</tspan>
  </text>
  <rect x="290" y="32" width="48" height="22" rx="6" fill="rgba(0, 242, 254, 0.15)" stroke="#00f2fe" stroke-width="1" />
  <text x="314" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#00f2fe" text-anchor="middle">
    AI
  </text>
  <text x="112" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="13" fill="#94a3b8" letter-spacing="1">
    VOICE SCAM DETECTION SYSTEM
  </text>
</svg>
